[package]
name = "sni-gate"
version = "2.5.1"
edition = "2021"
rust-version = "1.88"
description = "Multi-listener SNI/Host-routing TLS gateway: dynamic per-SNI certificate issuance on termination, with ECH / TLS / HTTP / raw upstreams"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["tls", "sni", "ech", "reverse-proxy", "certificate"]
categories = ["network-programming"]

[[bin]]
name = "sni-gate"
path = "src/main.rs"

# Terminal UI. SHELVED as of 2026-10-04: nothing in a default build, test run or
# CI touches it. `src/lib.rs` declares the module under `#[cfg(feature = "tui")]`,
# the binary below is `required-features`, and the three test targets after it are
# too — so `cargo test --locked` does not even compile them.
# To pick it back up: cargo test --features tui && cargo build --features tui
# Visual language: docs/design-language.md §6. Usage: docs/tui.md.
[[bin]]
name = "sni-gate-tui"
path = "src/bin/sni-gate-tui.rs"
required-features = ["tui"]

[[test]]
name = "tui_visual_language"
path = "tests/tui_visual_language.rs"
required-features = ["tui"]

[[test]]
name = "tui_mouse"
path = "tests/tui_mouse.rs"
required-features = ["tui"]

[[test]]
name = "tui_surfaces"
path = "tests/tui_surfaces.rs"
required-features = ["tui"]

[features]
default = []
tui = ["dep:ratatui"]

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "time", "sync"] }

# TLS with native ECH client support. aws-lc-rs provides the HPKE suites ECH
# needs; the whole binary standardizes on this one provider.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "1"

# DNS: DoH / DoT / plain, for ECH HTTPS-record lookups and upstream A/AAAA.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "https-aws-lc-rs", "tls-aws-lc-rs", "webpki-roots"] }

# Local CA + dynamic leaf issuance.
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
x509-parser = "0.18"

# Routing (precompiled regex), wildcard base derivation (public suffix list).
regex = "1"
publicsuffix = "2"

# Upstream pools: CIDR sampling and posterior throughput distributions.
ipnet = "2"
rand = "0.10"
rand_distr = "0.6"

# In-memory caches (issued certs, per-inner ECH configs).
moka = { version = "0.12", features = ["sync"] }

# PSL network refresh + file watching for auto-reload.
ureq = "3"
notify = "7"

# Config, logging, misc.
serde = { version = "1", features = ["derive"] }
toml = "0.9"
humantime-serde = "1"
base64 = "0.22"
url = "2"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
time = "0.3"
ratatui = { version = "0.30.2", optional = true }

# Trusted-root installation: CryptoAPI on Windows, nothing extra elsewhere.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
# Parse SANs out of the leaf the gateway issues, to assert served coverage
# end-to-end. Same version as the runtime dependency.
x509-parser = "0.18"
# For PSL fallback tests: backdate file mtime to simulate stale files.
filetime = "0.2"
